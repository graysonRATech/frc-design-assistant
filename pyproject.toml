[project]
name = "frc-design-rag"
version = "0.1.0"
description = "Cited Q&A assistant for FRC design, CAD and fabrication questions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "pypdf>=6.0",
    "pyyaml>=6.0",
]

[project.scripts]
kb = "frcrag.cli:main"

[dependency-groups]
aws = [
    "boto3[crt]>=1.44.3",
]
dev = ["pytest>=8", "pyjwt[crypto]>=2.15.1"]
infra = [
    "aws-cdk-lib>=2.277.0",
    "constructs>=10.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frcrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]
