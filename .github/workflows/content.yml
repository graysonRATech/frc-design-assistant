# Refreshes the knowledge base: weekly, when sources change on main, or by hand. Re-fetches every
# source, uploads changed chunks, re-indexes (Bedrock only re-embeds changed files), then reports
# retrieval quality. Uses the FrcRag-github-content role, which can only touch the content
# bucket and the Knowledge Base.
name: Refresh content

on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC
  push:
    branches: [main]
    paths:
      - sources.yaml
      - src/frcrag/**
  workflow_dispatch:

concurrency:
  group: content
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC token for AWS

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --group aws --locked
      - name: Ingest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run kb ingest
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/FrcRag-github-content
          aws-region: us-east-1
      - name: Sync and re-index
        run: uv run kb sync
      - name: Retrieval eval
        run: |
          set -o pipefail
          uv run kb eval | tee eval.txt
          { echo '### Retrieval eval'; echo '```'; tail -n 1 eval.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
