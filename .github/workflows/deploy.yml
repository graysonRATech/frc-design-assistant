# Deploys the stack when infrastructure, backend or web code changes on main.
#
# Setup (README "Continuous deployment"): repository variable GOOGLE_CLIENT_ID and
# optionally MODEL_CONFIG (JSON overrides for the model block, see scripts/ci_config.py) and
# DOMAIN_NAME with secret CERTIFICATE_ARN (custom domain),
# secrets AWS_ACCOUNT_ID and ALERT_EMAIL (secrets are masked in the public logs), and an environment named `production` (add yourself as a required reviewer
# if others can push to main). The FrcRag-github-deploy role must already exist: deploy once
# from your machine with github.repo set in config.local.yaml.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - infra/**
      - backend/**
      - web/**
      - scripts/**
      - config.example.yaml
      - cdk.json
      - pyproject.toml
      - uv.lock
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC token for AWS

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production # must match DEPLOY_ENVIRONMENT in infra/github_access.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --all-groups --locked
      - run: uv run pytest
      - name: Write config.local.yaml
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          MODEL_CONFIG: ${{ vars.MODEL_CONFIG }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          CERTIFICATE_ARN: ${{ secrets.CERTIFICATE_ARN }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: uv run python scripts/ci_config.py
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/FrcRag-github-deploy
          aws-region: us-east-1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npx --yes aws-cdk@2.1148.1 deploy --require-approval never
