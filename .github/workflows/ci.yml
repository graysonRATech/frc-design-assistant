# Tests and a CDK synth on every pull request and push. Needs no AWS access or secrets, so it is
# safe to run on pull requests from forks.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --all-groups --locked
      - run: uv run pytest
      - name: Validate sources.yaml
        run: uv run kb sources
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: CDK synth (example config)
        run: npx --yes aws-cdk@2.1148.1 synth --quiet
